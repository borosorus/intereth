name: Feature branch build check

on:
  push:
    branches:
      - feat/interface-and-sequential-execution

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --legacy-peer-deps
      - run: npm test -- --watchAll=false
      - run: npm run build
